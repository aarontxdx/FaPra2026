<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geocoder - Fachpraktikum</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  
  <style>
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    header {
      grid-column: 1 / 3;
      background: #333;
      color: white;
      padding: 1rem;
    }

    aside {
      background: #f4f4f4;
      padding: 1rem;
      overflow-y: auto;
      border-right: 1px solid #ccc;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    footer {
      grid-column: 1 / 3;
      background: #eee;
      padding: 0.5rem;
      text-align: center;
    }

    .tabs {
    display: flex;
    gap: 0.5rem;
    margin: 0.5rem 0 1rem 0;
    }

    .tab {
    flex: 1;
    padding: 0.4rem;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.9rem;
    }

    .tab.active {
    background: #333;
    color: white;
    border-color: #333;
    }

    .tab:hover {
    background: #eee;
    }
  </style>
</head>

<body>

  <header>
    <h1>OSM Data Processing</h1>
  </header>

  <aside>
    <!-- Tabs direkt unter Titel -->
    <div class="tabs">
        <button class="tab active" data-tab="osm">OSM Data</button>
        <button class="tab" data-tab="reverse">Reverse Geocoder</button>
    </div>

    <hr>

    <!-- OSM -->
    <section id="osmSection">
        <h3>OSM Data</h3>

    <section>
      <h3>Filter</h3>
      <label>
        <input type="checkbox" id="showBuildings" >
        Show buildings
      </label><br>
      <label>
        <input type="checkbox" id="showAdminAreas">
        Show Administrtion Areas
      </label>
      <label><br>
        <input type="checkbox" id="showStreets">
        Show streets
      </label><br>
    </section>

    <section>
      <h3>Settings</h3>

      <!-- Building -->
      <label>Building threshold:</label><br>
      <input type="text" id="thresholdInput" placeholder="Building threshold">
      <button onclick="setThreshold(document.getElementById('thresholdInput').value)">
        Set building threshold
      </button>

      <br><br>

      <!-- AdminAreas -->
      <label>Admin threshold:</label><br>
      <input type="text" id="adminThresholdInput" placeholder="Admin area threshold">
      <button onclick="setAdminThreshold(document.getElementById('adminThresholdInput').value)">
        Set admin threshold
      </button>

      <br><br>

      <!-- Roads -->
      <label>Road threshold:</label><br>
      <input type="text" id="roadThresholdInput" placeholder="Road threshold">
      <button onclick="setRoadThreshold(document.getElementById('roadThresholdInput').value)">
        Set road threshold
      </button>

      <br><br>

      <!-- Optional: Slider behalten -->
      <label for="adminSlider">Admin-Level:</label>
      <input type="range" id="adminSlider" min="0" max="7" step="1" value="0">
      <span id="adminLabel"></span>
    </section>
    </section>

    <!-- Reverse -->
    <section id="reverseSection" style="display:none;">
        <h3>Reverse Geocoder</h3>

        <p>Klicke auf die Karte, um eine Adresse zu erhalten.</p>

        <label for="geocoderMode">Geocoder Mode:</label><br>

        <select id="geocoderMode">
        <option value="automatic">Automatic</option>
        <option value="building">Nearest Building</option>
        <option value="2">Country</option>
        <option value="4">State</option>
        <option value="6">county</option>
        <option value="8">city</option>
        </select>

        <br><br>
    </section>
    </aside>

  <main id="map"></main>

  <footer>
    2026 – Fachpraktikum Aaron Paulus
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([48.7758, 9.1829], 13);
    var buildingThreshold = 1000;
    var adminThreshold = 10;
    var roadThreshold = 10000
    let mapMode = "browse";

    var currentAdminLevel = 2;

    const tabs = document.querySelectorAll(".tab");
    const osmSection = document.getElementById("osmSection");
    const reverseSection = document.getElementById("reverseSection");

    const buildingLayer = L.layerGroup();
    const adminLayer = L.layerGroup();
    const streetLayer = L.layerGroup();

    const slider = document.getElementById("adminSlider");
    const adminLabel = document.getElementById("adminLabel");
    const buildingCheckBox = document.getElementById("showBuildings");
    const adminAreaCheckBox = document.getElementById("showAdminAreas")
    const streetCheckBox = document.getElementById("showStreets");
    const geocoderMode = document.getElementById("geocoderMode");

    const adminLevels = [
    { level: 2,  name: "Land" },
    { level: 4,  name: "Bundesland" },
    { level: 5,  name: "Regierungsbezirk" },
    { level: 6,  name: "Landkreis / Kreisfreie Stadt" },
    { level: 7,  name: "Stadt"},
    { level: 8,  name: "Gemeinde / Stadt" },
    { level: 9,  name: "Stadtbezirk" },
    { level: 10, name: "Ortsteil / Stadtteil" }
    ];

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    }).addTo(map);

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {

            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            const mode = tab.dataset.tab;

            if (mode === "osm") {

                mapMode = "browse";

                osmSection.style.display = "block";
                reverseSection.style.display = "none";

                map.closePopup();

            } else {

                mapMode = "reverse_geocode";

                osmSection.style.display = "none";
                reverseSection.style.display = "block";
            }
        });
    });

    buildingCheckBox.addEventListener("change", (e) => {
        if (e.target.checked) {
            map.addLayer(buildingLayer);   // Marker anzeigen
            loadBuildings();
        } else {
            map.removeLayer(buildingLayer);
        }
    });

    adminAreaCheckBox.addEventListener("change", (e) => {
        if (e.target.checked) {
            map.addLayer(adminLayer);   // Marker anzeigen
            loadAdminAreas();
        } else {
            map.removeLayer(adminLayer);
        }
    });

    streetCheckBox.addEventListener("change", (e) => {
        if (e.target.checked) {
            map.addLayer(streetLayer);
            loadStreets();
        } else {
            map.removeLayer(streetLayer);
        }
    });

    slider.addEventListener("input", updateAdminLevel);

    map.on("click", async (e) => {
            if (mapMode !== "reverse_geocode")
                return;

            if (geocoderMode.value == "automatic") {
                const zoom = map.getZoom();

                if (zoom >= 14)
                {
                    showReverseGeocoderBuildings(e);
                }
                else
                {
                    showReverseGeocoderAreas(e, getAdminLevel(zoom));
                }
            } 
            else if (geocoderMode.value == "building"){
                showReverseGeocoderBuildings(e);
            }
            else
            {
                showReverseGeocoderAreas(e, geocoderMode.value);
            }
        });

    function loadBuildings() {
        buildingLayer.clearLayers();

        const bounds = map.getBounds();

        const minLat = bounds.getSouth();
        const maxLat = bounds.getNorth();
        const minLon = bounds.getWest();
        const maxLon = bounds.getEast();

        fetch(`http://localhost:8080/loadBuildings?threshold=${buildingThreshold}`
            + `&minLat=${minLat}&minLon=${minLon}&maxLat=${maxLat}&maxLon=${maxLon}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(b => {
                    const [lon, lat] = b.centroid;

                    const marker = L.circleMarker([lat, lon], {
                        radius: 4,
                        color: "red",
                        fillColor: "red",
                        fillOpacity: 0.8
                    });

                    marker.bindPopup(`
                        <b>${b.name || "Building"}</b><br>
                        ${b.street ?? ""} ${b.housenumber ?? ""}<br>
                        ${b.postcode ?? ""} ${b.city ?? ""}<br>
                        ${b.country ?? ""}<br>
                        ${b.state ?? ""}<br>
                        ${b.county ?? ""}
                    `);

                    buildingLayer.addLayer(marker);
                });
            });
    }

    function loadAdminAreas() {

        // Layer leeren (wichtig: Klammern!)
        adminLayer.clearLayers();

        fetch("http://localhost:8080/loadAdminAreas?adminLevel=" + currentAdminLevel 
              + "&threshold=" + adminThreshold)
        .then(res => res.json())
        .then(data => {
            L.geoJSON(data, {
                style: function (feature) {
                    return {
                        color: "blue",
                        weight: 2,
                        fillColor: "lightblue",
                        fillOpacity: 0.3
                    };
                },
                onEachFeature: function (feature, layer) {
                  layer.bindPopup(
                      "Name: " + feature.properties.name + "<br>" +
                      "ID: " + feature.properties.id
                  );
                }
            }).addTo(adminLayer);
        });
    }

    function loadStreets() {
        streetLayer.clearLayers();

        const bounds = map.getBounds();

        const minLat = bounds.getSouth();
        const maxLat = bounds.getNorth();
        const minLon = bounds.getWest();
        const maxLon = bounds.getEast();

        fetch(`http://localhost:8080/loadStreets?threshold=${roadThreshold}`
            + `&minLat=${minLat}&minLon=${minLon}`
            + `&maxLat=${maxLat}&maxLon=${maxLon}`)
            .then(res => res.json())
            .then(data => {

                L.geoJSON(data, {
                    style: function(feature) {
                        switch (feature.properties.type) {
                            case "motorway": return { color: "red", weight: 5 };
                            case "primary": return { color: "orange", weight: 4 };
                            case "secondary": return { color: "yellow", weight: 3 };
                            case "residential": return { color: "gray", weight: 2 };
                            default: return { color: "black", weight: 1 };
                        }
                    },

                    onEachFeature: function(feature, layer) {
                        layer.bindPopup(
                            `<b>${feature.properties.name || "Unknown road"}</b><br>
                            Type: ${feature.properties.type}<br>
                            ${feature.properties.postcode ?? ""} ${feature.properties.city ?? ""}<br>
                            ${feature.properties.country ?? ""}<br>
                            ${feature.properties.state ?? ""}<br>
                            ${feature.properties.county ?? ""}`
                        );
                    }

                }).addTo(streetLayer);

            });
    }

    async function showReverseGeocoderAutomatic(e){
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        try {

            const res = await fetch(
                `http://localhost:8080/reverseGeocodeAutomatic?lat=${lat}&lon=${lon}`
            );

            if (!res.ok) {
                console.error(await res.text());
                return;
            }

            const data = await res.json();

            L.popup()
                .setLatLng([lat, lon])
                .setContent(`
                    <b>${data.name || "Building"}</b><br/>
                    ${data.street ?? ""} ${data.housenumber ?? ""}<br/>
                    ${data.postcode ?? ""} ${data.city ?? ""}<br/>
                    ${data.county ?? ""} ${data.state ?? ""}<br/>
                    ${data.country ?? ""}
                `)
                .openOn(map);

            } catch (err) {

            console.error("Reverse geocoding failed:", err);
        }
    }

    async function showReverseGeocoderBuildings(e){
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        try {

            const res = await fetch(
                `http://localhost:8080/reverseGeocodeBuilding?lat=${lat}&lon=${lon}`
            );

            if (!res.ok) {
                console.error(await res.text());
                return;
            }

            const data = await res.json();

            L.popup()
                .setLatLng([lat, lon])
                .setContent(`
                    <b>${data.name || "Building"}</b><br/>
                    ${data.street ?? ""} ${data.housenumber ?? ""}<br/>
                    ${data.postcode ?? ""} ${data.city ?? ""}<br/>
                    ${data.county ?? ""} ${data.state ?? ""}<br/>
                    ${data.country ?? ""}
                `)
                .openOn(map);

            } catch (err) {

            console.error("Reverse geocoding failed:", err);
        }
    }

    let reverseAreaLayer = L.geoJSON(null).addTo(map);

    async function showReverseGeocoderAreas(e, geocoderMode)
    {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        try
        {
            const res = await fetch(
                `http://localhost:8080/reverseGeocodeArea?lat=${lat}&lon=${lon}&adminLevel=${geocoderMode}`
            );

            if (!res.ok)
            {
                console.error(await res.text());
                return;
            }

            const geojson = await res.json();

            // alte Ergebnisse löschen
            reverseAreaLayer.clearLayers();

            reverseAreaLayer = L.geoJSON(geojson, {
                style: function (feature)
                {
                    return {
                        color: "blue",
                        weight: 2,
                        fillColor: "lightblue",
                        fillOpacity: 0.3
                    };
                },
                onEachFeature: function (feature, layer)
                {
                    layer.bindPopup(`
                        <b>${feature.properties.name || "Area"}</b><br/>
                        ID: ${feature.properties.id}
                    `);
                }
            });

            reverseAreaLayer.addTo(map);
        }
        catch (err)
        {
            console.error("Reverse geocoding failed:", err);
        }
    }

    function setThreshold(newThreshold) {
        if (!isNaN(newThreshold) && newThreshold.trim() !== "") {
            buildingThreshold = Number(newThreshold);
            console.log("Threshold:", buildingThreshold);
        } else {
            console.log("Keine gültige Zahl!");
        }
    }

    function setAdminThreshold(newThreshold) {
        if (!isNaN(newThreshold) && newThreshold.trim() !== "") {
            adminThreshold = Number(newThreshold);
            console.log("Threshold:", adminThreshold);
        } else {
            console.log("Keine gültige Zahl!");
        }
    }

    function setRoadThreshold(newThreshold) {
        if (!isNaN(newThreshold) && newThreshold.trim() !== "") {
            roadThreshold = Number(newThreshold);
            console.log("Threshold:", roadThreshold);
        } else {
            console.log("Keine gültige Zahl!");
        }
    }

    function updateAdminLevel() {
        const index = Number(slider.value);
        const entry = adminLevels[index];

        currentAdminLevel = entry.level;
        adminLabel.textContent = `${entry.name} (admin_level=${entry.level})`;
    }

    function getAdminLevel(zoom)
    {
        if (zoom <= 4) return "2";   // country
        if (zoom <= 7) return "4";   // state
        if (zoom <= 10) return "6";  // county
        if (zoom <= 13) return "8";  // city
        return "9";                  // district
    }

    updateAdminLevel();
  </script>

</body>
</html>
